name: Publish backend image

# Builds the backend Docker image on GitHub runners and pushes it to GHCR, so
# the cloud VM never builds from source (the build is RAM-hungry). Deploy on
# the server is `docker compose -f docker-compose.yml -f docker-compose.server.yml pull && up -d`.

on:
  push:
    branches: [main, minimac]
    paths-ignore:
      - "docs/**"
      - "mobile/**"
      - "frontend/**"
      - "**.md"
  workflow_dispatch:

env:
  # GHCR only allows lowercase image names.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/legal-ai-burkina-api

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push (linux/amd64 for the VM)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub runners: use the default registry/PyPI (the repo defaults
          # are China mirrors meant for the Mac build host).
          build-args: |
            PYTHON_IMAGE=python:3.12-slim
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max
