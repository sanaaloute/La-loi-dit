name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[test]'

      - name: Compile check
        run: python -m compileall backend -q

      - name: Regression tests
        run: python -m pytest tests -q

      - name: Offline RAG evaluation
        run: |
          python -m backend.evaluation.runner --dataset backend/evaluation/golden_dataset.json --out data/eval/eval_report
          python - <<'PY'
          import json
          report = json.load(open('data/eval/eval_report.json', encoding='utf-8'))
          minimum = 0.85
          if report['pass_rate'] < minimum:
              raise SystemExit(f"Offline RAG pass rate {report['pass_rate']:.1%} is below {minimum:.0%}")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: legal-ai-burkina:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
