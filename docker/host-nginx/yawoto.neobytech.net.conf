# Rate limiting zone: 10 requests/second per IP with a 20-request burst.
limit_req_zone $binary_remote_addr zone=yawoto_api:10m rate=10r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __DOMAIN__;

    # Redirect all HTTP traffic to HTTPS.
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 100m: admins may upload documents up to 100 MB (backend enforces the
    # per-role limits — 100 MB admin, 25 MB regular users — with HTTP 413).
    client_max_body_size 100m;

    # ------------------------------------------------------------------
    # Long-running AI endpoints (browser path via the Next.js same-origin
    # proxy "/backend-api/*"): the agent graph can legitimately take several
    # minutes. SSE heartbeats keep the stream alive; POST /chat answers in a
    # single shot at the end. 620 s > the backend hard cap (600 s).
    # ------------------------------------------------------------------
    location /backend-api/api/v1/chat {
        limit_req zone=yawoto_api burst=20 nodelay;

        proxy_pass http://100.85.212.11:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    location /backend-api/api/v1/ws {
        proxy_pass http://100.85.212.11:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # Default location: proxy to the Next.js frontend on the Mac Mini,
    # reached over the Tailscale tunnel (this EC2 is a pure public relay;
    # the whole stack runs on the Mac). Tailscale IPs are stable per node.
    # ------------------------------------------------------------------
    location / {
        limit_req zone=yawoto_api burst=20 nodelay;

        proxy_pass http://100.85.212.11:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SSE chat streaming: no buffering, no caching, longer read timeout.
    location /api/v1/chat/stream {
        limit_req zone=yawoto_api burst=20 nodelay;

        proxy_pass http://100.85.212.11:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    # WebSocket chat endpoint.
    location /api/v1/ws/chat {
        proxy_pass http://100.85.212.11:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
