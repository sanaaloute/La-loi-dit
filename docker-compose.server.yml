# Cloud-server overrides for the production VM.
#
#   - api: pull the CI-built image from GHCR (see .github/workflows/publish.yml)
#     instead of building on the VM — builds are RAM-hungry and the VM is small.
#   - frontend: not deployed here; the web app is hosted on Cloudflare. The
#     "never" profile keeps it out of every `up` on this stack.
#   - Memory caps keep the stack inside a small shared VM (target ~4 GB total).
#
# Requires Docker Compose v2.24+ (for `!reset`). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# One-time on the server: `docker login ghcr.io` with a GitHub PAT that has
# read:packages (or mark the package public in the repo's package settings).

name: legal-ai-burkina

services:
  api:
    image: ghcr.io/sanaaloute/legal-ai-burkina-api:latest
    build: !reset null
    pull_policy: always
    mem_limit: 3g
    mem_reservation: 1g

  frontend:
    profiles: ["never"]

  milvus:
    mem_limit: 3g
    mem_reservation: 1g

  etcd:
    mem_limit: 256m

  # minio is already capped at 512m in the base file.
  # NOTE: upstream registries no longer serve minio/minio tags (docker.io
  # denies, quay repo is gone). The image is sideloaded onto the VM via
  # `docker save | ssh ... docker load` — see docs/deployment-cloud.md.
  postgres:
    mem_limit: 512m

  redis:
    mem_limit: 128m

  # Cloudflare Tunnel (remotely-managed tunnel "yawoto-vm" in the Zero Trust
  # dashboard). Reaches the api inside the compose network as http://api:8000 —
  # no open host ports, no nginx/certbot. Public hostnames are configured in
  # the dashboard (api2-yawoto for testing, api-yawoto after cutover), both
  # pointing to http://api:8000. The token is a dashboard secret: put
  # CLOUDFLARE_TUNNEL_TOKEN=eyJ... in the VM's .env.
  # Image tag 2025.8.1 is already cached on the VM; bump when convenient.
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    restart: unless-stopped
    mem_limit: 128m
    networks: [legal-net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
