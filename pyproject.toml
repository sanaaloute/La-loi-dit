[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-ai-burkina"
version = "0.1.0"
description = "Production-grade Agentic AI Legal Assistant for Burkina Faso laws and regulations"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
guardrails = ["llm-guard>=0.3.0,<1.0.0"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
